<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios - Biblioteca Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1e3a5f",
              secondary: "#0d9488",
              accent: "#3b82f6",
              light: "#f0f9ff",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .sidebar-link.active {
        background-color: #0d9488;
        color: white;
      }
      .card-hover:hover {
        transform: translateY(-2px);
      }
      .transition-all {
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="w-64 bg-primary text-white flex flex-col fixed h-full z-20">
        <div class="p-6 border-b border-blue-900/40">
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 bg-secondary rounded-lg flex items-center justify-center"
            >
              <i class="fas fa-book-open text-xl"></i>
            </div>
            <div>
              <h1 class="font-bold text-lg leading-tight">Biblioteca</h1>
              <p class="text-teal-300 text-xs font-medium">Cloud</p>
            </div>
          </div>
        </div>
        <nav class="flex-1 p-4 space-y-1">
          <a
            href="index.html"
            class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-900/50 transition-all"
          >
            <i class="fas fa-home w-5"></i> <span>Dashboard</span>
          </a>
          <a
            href="usuarios.html"
            class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg transition-all"
          >
            <i class="fas fa-users w-5"></i> <span>Usuarios</span>
          </a>
          <a
            href="libros.html"
            class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-900/50 transition-all"
          >
            <i class="fas fa-book w-5"></i> <span>Libros</span>
          </a>
          <a
            href="prestamos.html"
            class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-900/50 transition-all"
          >
            <i class="fas fa-handshake w-5"></i> <span>Préstamos</span>
          </a>
        </nav>
        <div class="p-4 border-t border-blue-900/40 text-xs text-blue-200">
          <p>Gestión Digital para</p>
          <p class="font-medium text-white">Bibliotecas Modernas</p>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 ml-64">
        <header
          class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10"
        >
          <div>
            <h2 class="text-2xl font-bold text-primary">Gestión de Usuarios</h2>
            <p class="text-slate-500 text-sm">
              Administra los usuarios de la biblioteca
            </p>
          </div>
          <button
            onclick="openModal()"
            class="bg-secondary hover:bg-teal-700 text-white px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 transition-all"
          >
            <i class="fas fa-user-plus"></i> Nuevo Usuario
          </button>
        </header>

        <div class="p-8">
          <!-- Search -->
          <div class="mb-6">
            <div class="relative max-w-md">
              <i
                class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
              ></i>
              <input
                type="text"
                id="search"
                placeholder="Buscar por nombre o cédula..."
                class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary"
                oninput="renderUsuarios()"
              />
            </div>
          </div>

          <!-- Table -->
          <div
            class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden"
          >
            <table class="w-full">
              <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                  <th
                    class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider"
                  >
                    Nombre
                  </th>
                  <th
                    class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider"
                  >
                    Cédula
                  </th>
                  <th
                    class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider"
                  >
                    Teléfono
                  </th>
                  <th
                    class="text-right px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider"
                  >
                    Acciones
                  </th>
                </tr>
              </thead>
              <tbody id="usuarios-table" class="divide-y divide-slate-100">
                <!-- JS fills -->
              </tbody>
            </table>
            <div
              id="empty-usuarios"
              class="hidden p-12 text-center text-slate-400"
            >
              <i class="fas fa-users text-4xl mb-3"></i>
              <p>No hay usuarios registrados</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal -->
    <div
      id="modal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-xl w-full max-w-md mx-4 shadow-2xl">
        <div
          class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"
        >
          <h3 class="font-bold text-lg text-primary" id="modal-title">
            Nuevo Usuario
          </h3>
          <button
            onclick="closeModal()"
            class="text-slate-400 hover:text-slate-600"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form
          id="usuario-form"
          onsubmit="saveUsuario(event)"
          class="p-6 space-y-4"
        >
          <input type="hidden" id="usuario-id" />
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1"
              >Nombre completo</label
            >
            <input
              type="text"
              id="nombre"
              required
              class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1"
              >Cédula</label
            >
            <input
              type="text"
              id="cedula"
              required
              class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1"
              >Teléfono</label
            >
            <input
              type="text"
              id="telefono"
              required
              class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            />
          </div>
          <div class="flex gap-3 pt-2">
            <button
              type="button"
              onclick="closeModal()"
              class="flex-1 px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition-all"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="flex-1 px-4 py-2 bg-secondary hover:bg-teal-700 text-white rounded-lg font-medium transition-all"
            >
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderUsuarios();
      });
    </script>
  </body>
</html>
